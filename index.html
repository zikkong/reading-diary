const today=()=>{let d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};function toast(s){$('toast').textContent=s;$('toast').hidden=false;clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').hidden=true,3000)}function el(tag,cls,txt){let e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}function empty(title,desc,add=false){let e=el('div','empty');e.append(el('div','symbol','▤'),el('h3','',title),el('p','',desc));if(add){let b=el('button','primary','첫 책 기록하기');b.onclick=()=>openBook();e.append(b)}return e}function render(){ $('total').textContent=records.length+'권';$('month').textContent=records.filter(r=>r.date?.startsWith(today().slice(0,7))).length+'권';let q=$('search').value.trim().toLowerCase(),list=records.filter(r=>(r.title+' '+r.author).toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));$('books').replaceChildren();if(!list.length)$('books').append(empty(q?'검색 결과가 없어요':'아직 기록한 책이 없어요',q?'다른 검색어를 입력해 보세요.':'첫 번째 책을 기록해 나만의 책장을 채워 보세요.',!q));for(let r of list){let b=el('button','book');b.type='button';b.onclick=()=>openBook(r);let c=r.cover?el('img','cover'):el('div','cover',r.title);if(r.cover){c.src=r.cover;c.alt=r.title+' 표지'}b.append(c,el('b','',r.title),el('div','author',r.author||'작가 미입력'),el('div','stars',r.rating?'★'.repeat(r.rating)+'☆'.repeat(5-r.rating):'평점 없음'));$('books').append(b)}$('quotes').replaceChildren();let groups=[...records].sort((a,b)=>b.date.localeCompare(a.date)).filter(r=>parseQuotes(r.quote).length);if(!groups.length)$('quotes').append(empty('아직 남긴 문장이 없어요','독서 기록에 인상 깊은 구절을 추가해 보세요.'));for(let r of groups){let qs=parseQuotes(r.quote),group=el('details','quote-group'),head=el('summary','quote-book-head'),c=r.cover?el('img','quote-cover'):el('div','quote-cover quote-cover-empty','▤');if(r.cover){c.src=r.cover;c.alt=r.title+' 표지';c.onerror=()=>c.replaceWith(el('div','quote-cover quote-cover-empty','▤'))}let meta=el('div','quote-book-meta');meta.append(el('b','',r.title),el('span','author',r.author||'작가 미입력'),el('span','quote-count',qs.length+'개 구절'));head.append(c,meta,el('span','quote-chevron','⌄'));group.append(head);let body=el('div','quote-group-body');for(let q of qs){let e=el('div','quote-line',q.text);if(q.page)e.append(el('small','', 'p. '+q.page));body.append(e)}group.append(body);$('quotes').append(group)}}function setRating(n){rating=n;$('ratingText').textContent=n?n+'점 / 5점':'선택 안 함';$('rate').replaceChildren();for(let i=1;i<=5;i++){let b=el('button','',i<=n?'★':'☆');b.type='button';b.setAttribute('aria-label',i+'점');b.setAttribute('aria-pressed',i===n);b.onclick=()=>setRating(i===rating?0:i);$('rate').append(b)}}function showCover(){ $('preview').hidden=!cover;if(cover)$('preview').src=cover;else $('preview').removeAttribute('src');$('removePhoto').hidden=!cover;$('photoText').textContent=cover?'사진 변경하기':'사진을 선택해 주세요 (선택)'}const quotePrefix='READING_QUOTES_V1:';
function parseQuotes(raw){if(!raw)return [];if(raw.startsWith(quotePrefix)){try{let a=JSON.parse(raw.slice(quotePrefix.length));if(Array.isArray(a)&&a.every(q=>q&&typeof q.text==='string'&&typeof q.page==='string'))return a.filter(q=>q.text.trim());}catch(e){}}return [{text:raw,page:''}]}

function serializeQuotes(){let a=[...$('quoteEntries').children].map(e=>({text:e.querySelector('textarea').value.trim(),page:e.querySelector('input').value.trim()})).filter(q=>q.text);return a.length?quotePrefix+JSON.stringify(a):''}
$('addQuote').onclick=()=>addQuote().focus();
function openBook(r){editing=r?.id||null;$('form').reset();for(let k of ['title','author','review'])$(k).value=r?.[k]||'';$('quoteEntries').replaceChildren();let qs=parseQuotes(r?.quote);if(qs.length)qs.forEach(q=>addQuote(q));else addQuote();$('date').value=r?.date||today();cover=r?.cover||'';showCover();setRating(r?.rating||0);$('modalTitle').textContent=r?'독서 기록 수정':'새로운 독서 기록';$('del').hidden=!r;$('dialog').showModal();$('dialog').scrollTop=0;$('dialog').scrollLeft=0}$('add').onclick=()=>openBook();$('close').onclick=()=>$('dialog').close();$('search').oninput=render;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t===b));$('booksPanel').hidden=b.dataset.tab!=='books';$('quotesPanel').hidden=b.dataset.tab!=='quotes'});$('photo').onchange=async e=>{let f=e.target.files[0];if(!f)return;photoPending=true;try{let im=new Image(),url=URL.createObjectURL(f);try{im.src=url;await im.decode();let scale=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);let ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);cover=c.toDataURL('image/jpeg',.78);showCover()}finally{URL.revokeObjectURL(url)}}catch(e){toast('사진을 열 수 없어요. 다른 사진을 선택해 주세요.')}finally{photoPending=false}};$('removePhoto').onclick=()=>{cover='';$('photo').value='';showCover()};function setBusy(v){busy=v;for(const b of $('form').querySelectorAll('button,input,textarea'))b.disabled=v;$('logout').disabled=v}
async function refresh(){if(!user||!client)return;const id=++loadId,uid=user.id;$('sync').textContent='동기화 중';try{let all=[],offset=0;while(true){const {data,error}=await client.from('reading_diary').select('*').eq('user_id',uid).order('id').range(offset,offset+99);if(error)throw error;all.push(...data);if(data.length<100)break;offset+=100}if(id!==loadId||user?.id!==uid)return;records=all.map(r=>({id:r.id,title:r.title,author:r.author||'',cover:r.cover_image||'',rating:r.rating||0,quote:r.favorite_quote||'',review:r.review||'',date:r.read_date||today()}));render();$('sync').textContent='동기화 완료'}catch(e){if(id===loadId){$('sync').textContent='연결 실패';toast('기록을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.')}}}
$('form').onsubmit=async e=>{e.preventDefault();if(!user||busy||photoPending)return;let r={title:$('title').value.trim(),author:$('author').value.trim(),favorite_quote:serializeQuotes(),review:$('review').value.trim(),read_date:$('date').value,rating:rating||null,cover_image:cover,user_id:user.id};if(!r.title){toast('책 제목을 입력해 주세요.');return}setBusy(true);try{let q=editing?client.from('reading_diary').update(r).eq('id',editing).eq('user_id',user.id):client.from('reading_diary').insert(r);const {error}=await q.select('id').single();if(error)throw error;$('dialog').close();toast('독서 기록을 저장했어요.');await refresh()}catch(e){toast('저장하지 못했어요. 연결을 확인하고 다시 시도해 주세요.')}finally{setBusy(false)}};
$('del').onclick=async()=>{if(!user||busy||!editing||!confirm('이 독서 기록을 삭제할까요?'))return;setBusy(true);try{const {error}=await client.from('reading_diary').delete().eq('id',editing).eq('user_id',user.id).select('id').single();if(error)throw error;$('dialog').close();toast('기록을 삭제했어요.');await refresh()}catch(e){toast('삭제하지 못했어요. 다시 시도해 주세요.')}finally{setBusy(false)}};
function sessionChanged(session){const next=session?.user||null;if(next?.id===user?.id)return;user=next;loadId++;records=[];if($('dialog').open)$('dialog').close();$('app').hidden=!user;$('authPanel').hidden=!!user;render();if(user)refresh()}
$('loginForm').onsubmit=async e=>{e.preventDefault();if(!client)return;$('loginButton').disabled=true;$('loginError').textContent='로그인 중…';try{const {data,error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('password').value='';$('loginError').textContent='';sessionChanged(data.session)}catch(e){$('loginError').textContent='로그인하지 못했어요. 이메일과 비밀번호를 확인해 주세요.'}finally{$('loginButton').disabled=false}};
$('logout').onclick=async()=>{if(busy)return;const {error}=await client.auth.signOut({scope:'local'});if(error){toast('로그아웃에 실패했어요.');return}sessionChanged(null)};
if(client){client.auth.onAuthStateChange((event,session)=>{setTimeout(()=>sessionChanged(session),0)});client.auth.getSession().then(({data})=>sessionChanged(data.session));}window.addEventListener('focus',()=>{if(user&&!busy)refresh()});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&user&&!busy)refresh()});setInterval(()=>{if(user&&!busy&&!document.hidden)refresh()},30000);render();
</script></body></html>
